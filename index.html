<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الرواتب والأوفر تايم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .hidden {
            display: none !important;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .salary-info {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            float: left;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 10px;
            text-align: center;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .total-row {
            background: #e7f5ff;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- شاشة تسجيل الدخول -->
        <div id="loginScreen">
            <h1>🔐 تسجيل الدخول</h1>
            <div id="loginMessage" class="alert hidden"></div>
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" />
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" />
            </div>
            <button class="btn" onclick="login()">تسجيل الدخول</button>
            <p style="text-align: center; margin-top: 15px; color: #666; font-size: 14px;">
                🔑 مستخدم تجريبي: ahmed / 123456
            </p>
        </div>

        <!-- الشاشة الرئيسية -->
        <div id="mainScreen" class="hidden">
            <h1>📊 نظام الرواتب</h1>
            <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
            <br><br>
            <div class="card">
                <p><strong>👤 المستخدم:</strong> <span id="currentUser"></span></p>
                <div class="salary-info">
                    الراتب الثابت: <span id="fixedSalary">0</span> ج.م
                </div>
            </div>

            <div id="setSalarySection" class="card">
                <h3>💵 تحديد الراتب الثابت</h3>
                <div class="form-group">
                    <label>الراتب الشهري الثابت (ج.م)</label>
                    <input type="number" id="fixedSalaryInput" placeholder="مثال: 5000" />
                </div>
                <button class="btn" onclick="setFixedSalary()">حفظ الراتب</button>
            </div>

            <div class="card">
                <h3>📝 إدخال الحضور اليومي</h3>
                <div class="grid-2">
                    <div class="form-group">
                        <label>📅 اليوم</label>
                        <input type="date" id="attendanceDate" />
                    </div>
                    <div class="form-group">
                        <label>⏰ عدد الساعات</label>
                        <input type="number" id="workHours" placeholder="مثال: 8" step="0.5" />
                    </div>
                </div>
                <div class="form-group">
                    <label>📌 نوع اليوم</label>
                    <select id="dayType">
                        <option value="normal">يوم عادي (×1)</option>
                        <option value="double">يوم مزدوج الأجر (×2)</option>
                    </select>
                </div>
                <button class="btn" onclick="addAttendance()">➕ إضافة اليوم</button>
            </div>

            <div class="card">
                <h3>📊 تقرير الشهر</h3>
                <div id="reportContainer">
                    <table id="attendanceTable">
                        <thead>
                            <tr>
                                <th>اليوم</th>
                                <th>الساعات</th>
                                <th>نوع اليوم</th>
                                <th>الأجر اليومي</th>
                                <th>الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceBody">
                        </tbody>
                        <tfoot id="attendanceFooter">
                        </tfoot>
                    </table>
                    <div id="totalSalary" style="margin-top: 15px; font-size: 18px; text-align: center; background: #e7f5ff; padding: 10px; border-radius: 10px;">
                        <strong>💰 إجمالي الراتب الشهري: <span id="totalSalaryAmount">0</span> ج.م</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== إدارة المستخدمين والبيانات ==========
        const STORAGE_KEY = 'salaryAppData';

        function loadData() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : { users: {} };
            } catch (e) {
                console.log('خطأ في تحميل البيانات:', e);
                return { users: {} };
            }
        }

        function saveData(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.log('خطأ في حفظ البيانات:', e);
            }
        }

        // ========== وظائف تسجيل الدخول ==========
        let currentUser = null;

        function login() {
            console.log('دالة login تم استدعاؤها');
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageDiv = document.getElementById('loginMessage');

            console.log('Username:', username);
            console.log('Password:', password);

            if (!username || !password) {
                showMessage(messageDiv, '❌ يرجى إدخال اسم المستخدم وكلمة المرور', 'danger');
                return;
            }

            const data = loadData();
            console.log('البيانات المحملة:', data);
            
            // إذا كان المستخدم جديداً، نقوم بتسجيله
            if (!data.users[username]) {
                data.users[username] = {
                    password: password,
                    fixedSalary: null,
                    attendance: []
                };
                saveData(data);
                console.log('تم إنشاء مستخدم جديد:', username);
                currentUser = username;
                showMainScreen();
                return;
            }

            // التحقق من كلمة المرور للمستخدم الموجود
            if (data.users[username].password === password) {
                console.log('تسجيل دخول ناجح');
                currentUser = username;
                showMainScreen();
            } else {
                console.log('كلمة مرور خاطئة');
                showMessage(messageDiv, '❌ كلمة المرور غير صحيحة', 'danger');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('loginMessage').classList.add('hidden');
        }

        function showMessage(element, text, type) {
            element.textContent = text;
            element.className = `alert alert-${type}`;
            element.classList.remove('hidden');
        }

        // ========== عرض الشاشة الرئيسية ==========
        function showMainScreen() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('currentUser').textContent = currentUser;
            
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('attendanceDate').value = today;

            loadUserData();
        }

        // ========== تحميل بيانات المستخدم ==========
        function loadUserData() {
            const data = loadData();
            const userData = data.users[currentUser];

            if (userData.fixedSalary) {
                document.getElementById('fixedSalary').textContent = userData.fixedSalary;
            } else {
                document.getElementById('fixedSalary').textContent = 'غير محدد';
            }

            renderAttendance(userData.attendance || [], userData.fixedSalary || 0);
        }

        // ========== تعيين الراتب الثابت ==========
        function setFixedSalary() {
            const salaryInput = document.getElementById('fixedSalaryInput');
            const salary = parseFloat(salaryInput.value);

            if (!salary || salary <= 0) {
                alert('⚠️ يرجى إدخال راتب صحيح أكبر من 0');
                return;
            }

            const data = loadData();
            data.users[currentUser].fixedSalary = salary;
            saveData(data);

            document.getElementById('fixedSalary').textContent = salary;
            
            renderAttendance(data.users[currentUser].attendance || [], salary);
            
            alert('✅ تم حفظ الراتب الثابت بنجاح!');
        }

        // ========== حساب أجر اليوم ==========
        function calculateDailyWage(hours, dayType, fixedSalary) {
            const dailyRate = fixedSalary / 30;
            const hourlyRate = dailyRate / 8;

            let totalWage = 0;
            
            if (dayType === 'double') {
                totalWage = hours * hourlyRate * 2;
            } else {
                if (hours <= 8) {
                    totalWage = hours * hourlyRate;
                } else {
                    const normalHours = 8;
                    const overtimeHours = hours - 8;
                    totalWage = (normalHours * hourlyRate) + (overtimeHours * hourlyRate * 1.5);
                }
            }

            return Math.round(totalWage * 100) / 100;
        }

        // ========== إضافة يوم حضور ==========
        function addAttendance() {
            const date = document.getElementById('attendanceDate').value;
            const hours = parseFloat(document.getElementById('workHours').value);
            const dayType = document.getElementById('dayType').value;

            if (!date) {
                alert('⚠️ يرجى اختيار التاريخ');
                return;
            }

            if (!hours || hours <= 0) {
                alert('⚠️ يرجى إدخال عدد ساعات صحيح');
                return;
            }

            if (hours > 24) {
                alert('⚠️ عدد الساعات لا يمكن أن يتجاوز 24 ساعة');
                return;
            }

            const data = loadData();
            const userData = data.users[currentUser];

            if (!userData.fixedSalary) {
                alert('⚠️ يرجى تحديد الراتب الثابت أولاً');
                return;
            }

            const existing = userData.attendance.find(a => a.date === date);
            if (existing) {
                alert('⚠️ هذا اليوم مسجل بالفعل! يمكنك حذفه وإعادة إضافته.');
                return;
            }

            const wage = calculateDailyWage(hours, dayType, userData.fixedSalary);

            userData.attendance.push({
                date: date,
                hours: hours,
                dayType: dayType,
                wage: wage
            });

            userData.attendance.sort((a, b) => a.date.localeCompare(b.date));

            saveData(data);
            renderAttendance(userData.attendance, userData.fixedSalary);

            document.getElementById('workHours').value = '';
            
            const nextDate = new Date(date);
            nextDate.setDate(nextDate.getDate() + 1);
            document.getElementById('attendanceDate').value = nextDate.toISOString().split('T')[0];

            alert('✅ تم إضافة اليوم بنجاح!');
        }

        // ========== حذف يوم ==========
        function deleteDay(date) {
            if (!confirm(`هل أنت متأكد من حذف يوم ${date}؟`)) return;

            const data = loadData();
            const userData = data.users[currentUser];
            userData.attendance = userData.attendance.filter(a => a.date !== date);
            saveData(data);
            renderAttendance(userData.attendance, userData.fixedSalary || 0);
        }

        // ========== عرض التقرير ==========
        function renderAttendance(attendance, fixedSalary) {
            const tbody = document.getElementById('attendanceBody');
            const tfoot = document.getElementById('attendanceFooter');
            
            if (!attendance || attendance.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #666;">لا توجد أيام مسجلة حتى الآن</td></tr>`;
                tfoot.innerHTML = '';
                document.getElementById('totalSalaryAmount').textContent = '0';
                return;
            }

            let totalSalary = 0;

            tbody.innerHTML = attendance.map(day => {
                totalSalary += day.wage;
                const dayTypeText = day.dayType === 'double' ? '🌟 مزدوج' : 'عادي';
                return `
                    <tr>
                        <td>${day.date}</td>
                        <td>${day.hours} س</td>
                        <td>${dayTypeText}</td>
                        <td>${day.wage} ج.م</td>
                        <td><button onclick="deleteDay('${day.date}')" style="background: #dc3545; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer;">🗑️</button></td>
                    </tr>
                `;
            }).join('');

            tfoot.innerHTML = `
                <tr class="total-row">
                    <td colspan="3"><strong>الإجمالي</strong></td>
                    <td><strong>${Math.round(totalSalary * 100) / 100} ج.م</strong></td>
                    <td></td>
                </tr>
            `;

            document.getElementById('totalSalaryAmount').textContent = Math.round(totalSalary * 100) / 100;
        }

        // ========== إضافة مستخدم تجريبي ==========
        function initDemoUser() {
            const data = loadData();
            if (!data.users['ahmed']) {
                data.users['ahmed'] = {
                    password: '123456',
                    fixedSalary: null,
                    attendance: []
                };
                saveData(data);
                console.log('تم إضافة المستخدم التجريبي');
            }
        }

        // ========== تشغيل التطبيق ==========
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ التطبيق بدأ تشغيله');
            initDemoUser();
            
            // اختبار localStorage
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                console.log('✅ localStorage يعمل بشكل صحيح');
            } catch (e) {
                console.log('❌ localStorage لا يعمل:', e);
                alert('⚠️ المتصفح لا يدعم LocalStorage. يرجى استخدام متصفح حديث.');
            }
        });

        // جعل الدوال عالمية للوصول من HTML
        window.login = login;
        window.logout = logout;
        window.setFixedSalary = setFixedSalary;
        window.addAttendance = addAttendance;
        window.deleteDay = deleteDay;

        console.log('✅ جميع الدوال جاهزة');
    </script>
</body>
</html>
